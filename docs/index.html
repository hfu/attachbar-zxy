<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AttachbarZxy Demo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .attachbar-sidebar {
        color: #0b1736;
        font: 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .attachbar-label {
        transform: translate(-50%, 0);
        padding: 2px 4px;
        background: rgb(255 255 255 / 75%);
        border-radius: 3px;
        white-space: nowrap;
      }

      .attachbar-sidebar--left .attachbar-label {
        transform: translate(0, -50%);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@attachbar-zxy/core": "./dist/core/index.js",
          "@attachbar-zxy/dom-renderer": "./dist/dom-renderer/index.js",
          "@attachbar-zxy/maplibre-adapter": "./dist/maplibre-adapter/index.js"
        }
      }
    </script>
    <script type="module">
      import { AttachbarZxyControl } from "@attachbar-zxy/maplibre-adapter";

      const map = new maplibregl.Map({
        container: "map",
        style: "https://hfu.github.io/kitavolca/style.json",
        center: [139.753, 35.684],
        zoom: 10
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");
      map.addControl(
        new AttachbarZxyControl({
          sides: ["top", "left"],
          minPixelSpacing: 56
        }),
        "top-left"
      );
    </script>
  </body>
</html>
